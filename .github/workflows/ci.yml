name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extension-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js

      - name: Validate extension manifest
        run: python -m json.tool manifest.json > /dev/null

      - name: Reject duplicate manifest keys
        run: |
          python - <<'PY'
          import json

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate key in manifest.json: {key}")
                  result[key] = value
              return result

          with open("manifest.json", "r", encoding="utf-8") as handle:
              json.load(handle, object_pairs_hook=reject_duplicates)
          PY

      - name: Guard against committed Groq secrets
        run: |
          if grep -RInE --exclude-dir=.git --exclude=README.md --exclude=SECURITY.md 'gsk_[A-Za-z0-9_-]{20,}' .; then
            echo "Potential Groq API key detected in repository content."
            exit 1
          fi

      - name: Verify manifest-referenced files
        run: |
          test -f background.js
          test -f content.js
          test -f styles.css
          test -f popup.html
          test -f icons/icon16.png
          test -f icons/icon48.png
          test -f icons/icon128.png
